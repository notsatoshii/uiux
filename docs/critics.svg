<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .g1{fill:#eef2f8;stroke:#7c8696;stroke-width:1.5}
    .g2{fill:#e6f4ee;stroke:#2f8f62;stroke-width:1.5}
    .g3{fill:#fff3d6;stroke:#c9931a;stroke-width:1.5}
    .t{fill:#1f2430;font-weight:600}
    .s{fill:#4a5262;font-size:11.5px}
    .h{fill:#1f2430;font-weight:700;font-size:13px}
    .gate{fill:#4a5262;font-size:12px;font-style:italic}
    .line{stroke:#7c8696;stroke-width:1.5;stroke-dasharray:5 4}
  </style>
  <!-- group 1 -->
  <text class="h" x="20" y="28">Every cycle</text>
  <g>
    <rect class="g1" x="20" y="40" width="150" height="48" rx="10"/><text class="t" x="30" y="60">01 best practices</text><text class="s" x="30" y="78">a11y · responsive · perf</text>
    <rect class="g1" x="180" y="40" width="150" height="48" rx="10"/><text class="t" x="190" y="60">02 references</text><text class="s" x="190" y="78">mechanics, receipts, Mobbin</text>
    <rect class="g1" x="340" y="40" width="150" height="48" rx="10"/><text class="t" x="350" y="60">03 design system</text><text class="s" x="350" y="78">tokens · tooltips · copy</text>
    <rect class="g1" x="500" y="40" width="150" height="48" rx="10"/><text class="t" x="510" y="60">04 functionality</text><text class="s" x="510" y="78">every feature, every state</text>
    <rect class="g1" x="660" y="40" width="140" height="48" rx="10"/><text class="t" x="670" y="60">05 aesthetic</text><text class="s" x="670" y="78">brand, sightline, no slop</text>
  </g>

  <line class="line" x1="20" y1="118" x2="800" y2="118"/>
  <text class="gate" x="20" y="140">gate: 04 functionality scored 8 or more</text>

  <!-- group 2 -->
  <g>
    <rect class="g2" x="20" y="152" width="230" height="48" rx="10"/><text class="t" x="30" y="172">06 visualize</text><text class="s" x="30" y="190">numbers and text → visuals, no invented data</text>
    <rect class="g2" x="260" y="152" width="280" height="48" rx="10"/><text class="t" x="270" y="172">07 motion</text><text class="s" x="270" y="190">A entrance + data · B hover, press, focus, state fx</text>
    <rect class="g2" x="550" y="152" width="250" height="48" rx="10"/><text class="t" x="560" y="172">08 delight + ideas</text><text class="s" x="560" y="190">signature move, voice; ideas never auto-built</text>
  </g>

  <line class="line" x1="20" y1="230" x2="800" y2="230"/>
  <text class="gate" x="20" y="252">gate: every other critic within one point of the bar</text>

  <!-- group 3 -->
  <rect class="g3" x="20" y="264" width="780" height="48" rx="10"/><text class="t" x="30" y="284">09 micro-craft</text><text class="s" x="30" y="302">radii, shadow tint, icon weight, optical alignment, light direction, motion physics — the numbered list, one level deeper than the visitor notices</text>
</svg>
