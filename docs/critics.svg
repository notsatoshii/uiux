<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .bg{fill:#ffffff;stroke:#d5dae2;stroke-width:1}
    .g1{fill:#eef2f8;stroke:#5b6472;stroke-width:1.6}
    .g2{fill:#e3f3ea;stroke:#2f8f62;stroke-width:1.6}
    .g3{fill:#fff1cf;stroke:#b8860b;stroke-width:1.6}
    .t{fill:#1b202a;font-weight:700;font-size:17px}
    .s{fill:#3d4552;font-size:13.5px}
    .h{fill:#1b202a;font-weight:700;font-size:20px}
    .gate{fill:#3d4552;font-size:14px;font-style:italic}
    .line{stroke:#5b6472;stroke-width:1.6;stroke-dasharray:6 5}
  </style>
  <rect class="bg" x="0.5" y="0.5" width="959" height="469" rx="16"/>
  <text class="h" x="32" y="42">Nine critics, three phases</text>
  <text class="gate" x="300" y="42">all run every cycle; the phase decides who leads the builder's list</text>

  <text class="gate" x="32" y="76">A structure · cycles 1–2 · leads</text>
  <g>
    <rect class="g1" x="32" y="88" width="286" height="70" rx="12"/><text class="t" x="46" y="116">04 functionality</text><text class="s" x="46" y="140">every feature, state, task walk</text>
    <rect class="g1" x="337" y="88" width="286" height="70" rx="12"/><text class="t" x="351" y="116">05 aesthetic</text><text class="s" x="351" y="140">brand, taste, calibration board</text>
    <rect class="g1" x="642" y="88" width="286" height="70" rx="12"/><text class="t" x="656" y="116">02 references</text><text class="s" x="656" y="140">mechanics, receipts</text>
  </g>

  <line class="line" x1="32" y1="186" x2="928" y2="186"/>
  <text class="gate" x="32" y="214">B feel · cycles 3–4 · leads</text>
  <g>
    <rect class="g2" x="32" y="226" width="286" height="70" rx="12"/><text class="t" x="46" y="254">06 visualize</text><text class="s" x="46" y="278">text and numbers → visuals</text>
    <rect class="g2" x="337" y="226" width="286" height="70" rx="12"/><text class="t" x="351" y="254">07 motion</text><text class="s" x="351" y="278">entrance, data, hover, press, focus</text>
    <rect class="g2" x="642" y="226" width="286" height="70" rx="12"/><text class="t" x="656" y="254">08 delight + ideas</text><text class="s" x="656" y="278">signature move, voice</text>
  </g>

  <line class="line" x1="32" y1="324" x2="928" y2="324"/>
  <text class="gate" x="32" y="352">C craft · cycles 5–6 · leads</text>
  <g>
    <rect class="g3" x="32" y="364" width="286" height="70" rx="12"/><text class="t" x="46" y="392">09 micro-craft</text><text class="s" x="46" y="416">radii, shadows, alignment (only here)</text>
    <rect class="g3" x="337" y="364" width="286" height="70" rx="12"/><text class="t" x="351" y="392">03 design system</text><text class="s" x="351" y="416">tokens, tooltips, copy clarity</text>
    <rect class="g3" x="642" y="364" width="286" height="70" rx="12"/><text class="t" x="656" y="392">01 best practices</text><text class="s" x="656" y="416">a11y, responsive, speed</text>
  </g>
</svg>
