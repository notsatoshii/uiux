<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .bg{fill:#ffffff;stroke:#d5dae2;stroke-width:1}
    .g1{fill:#eef2f8;stroke:#5b6472;stroke-width:1.6}
    .g2{fill:#e3f3ea;stroke:#2f8f62;stroke-width:1.6}
    .g3{fill:#fff1cf;stroke:#b8860b;stroke-width:1.6}
    .t{fill:#1b202a;font-weight:700;font-size:17px}
    .s{fill:#3d4552;font-size:13.5px}
    .h{fill:#1b202a;font-weight:700;font-size:20px}
    .gate{fill:#3d4552;font-size:14px;font-style:italic}
    .line{stroke:#5b6472;stroke-width:1.6;stroke-dasharray:6 5}
  </style>
  <rect class="bg" x="0.5" y="0.5" width="959" height="469" rx="16"/>
  <text class="h" x="32" y="42">The nine critics</text>

  <text class="gate" x="32" y="72">Every cycle</text>
  <g>
    <rect class="g1" x="32" y="84" width="170" height="70" rx="12"/><text class="t" x="46" y="112">01 best practices</text><text class="s" x="46" y="136">a11y · responsive · perf</text>
    <rect class="g1" x="214" y="84" width="170" height="70" rx="12"/><text class="t" x="228" y="112">02 references</text><text class="s" x="228" y="136">mechanics, receipts</text>
    <rect class="g1" x="396" y="84" width="170" height="70" rx="12"/><text class="t" x="410" y="112">03 design system</text><text class="s" x="410" y="136">tokens · tooltips · copy</text>
    <rect class="g1" x="578" y="84" width="170" height="70" rx="12"/><text class="t" x="592" y="112">04 functionality</text><text class="s" x="592" y="136">every feature, state</text>
    <rect class="g1" x="760" y="84" width="168" height="70" rx="12"/><text class="t" x="774" y="112">05 aesthetic</text><text class="s" x="774" y="136">brand, taste, no slop</text>
  </g>

  <line class="line" x1="32" y1="188" x2="928" y2="188"/>
  <text class="gate" x="32" y="216">After 04 functionality scores 8 or more</text>
  <g>
    <rect class="g2" x="32" y="228" width="280" height="70" rx="12"/><text class="t" x="46" y="256">06 visualize</text><text class="s" x="46" y="280">text and numbers → visuals, nothing invented</text>
    <rect class="g2" x="324" y="228" width="312" height="70" rx="12"/><text class="t" x="338" y="256">07 motion</text><text class="s" x="338" y="280">A entrance + data · B hover, press, focus, state</text>
    <rect class="g2" x="648" y="228" width="280" height="70" rx="12"/><text class="t" x="662" y="256">08 delight + ideas</text><text class="s" x="662" y="280">signature move, voice; ideas never built</text>
  </g>

  <line class="line" x1="32" y1="332" x2="928" y2="332"/>
  <text class="gate" x="32" y="360">After every other critic is within one point of the bar</text>
  <rect class="g3" x="32" y="372" width="896" height="70" rx="12"/><text class="t" x="46" y="400">09 micro-craft</text><text class="s" x="46" y="424">radii, shadow tint, icon weight, optical alignment, light direction, motion physics: one level deeper than the visitor notices</text>
</svg>
