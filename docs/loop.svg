<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6472"/></marker>
  </defs>
  <style>
    .bg{fill:#ffffff;stroke:#d5dae2;stroke-width:1}
    .box{fill:#eef2f8;stroke:#5b6472;stroke-width:1.6}
    .hot{fill:#ffe3da;stroke:#d93d22}
    .t{fill:#1b202a;font-weight:700;font-size:18px}
    .s{fill:#3d4552;font-size:14px}
    .l{stroke:#5b6472;stroke-width:2;fill:none;marker-end:url(#a)}
    .lab{fill:#3d4552;font-size:14px;font-style:italic}
    .h{fill:#1b202a;font-weight:700;font-size:20px}
  </style>
  <rect class="bg" x="0.5" y="0.5" width="959" height="399" rx="16"/>
  <text class="h" x="32" y="42">The loop</text>

  <!-- row 1 -->
  <rect class="box" x="32" y="70" width="190" height="80" rx="14"/>
  <text class="t" x="127" y="103" text-anchor="middle">1 Interview</text>
  <text class="s" x="127" y="128" text-anchor="middle">questions → brief.md</text>

  <rect class="box" x="262" y="70" width="190" height="80" rx="14"/>
  <text class="t" x="357" y="103" text-anchor="middle">2 First build</text>
  <text class="s" x="357" y="128" text-anchor="middle">only if nothing exists</text>

  <rect class="box" x="492" y="70" width="190" height="80" rx="14"/>
  <text class="t" x="587" y="103" text-anchor="middle">3 Screenshots</text>
  <text class="s" x="587" y="128" text-anchor="middle">phone, desktop, states</text>

  <rect class="box" x="722" y="70" width="206" height="80" rx="14"/>
  <text class="t" x="825" y="103" text-anchor="middle">4 Critics</text>
  <text class="s" x="825" y="128" text-anchor="middle">9 in parallel, scores 1–10</text>

  <path class="l" d="M222 110H262"/><path class="l" d="M452 110H492"/><path class="l" d="M682 110H722"/>

  <!-- row 2 -->
  <rect class="box" x="722" y="250" width="206" height="80" rx="14"/>
  <text class="t" x="825" y="283" text-anchor="middle">5 Merge, rank</text>
  <text class="s" x="825" y="308" text-anchor="middle">severity 1 → 2 → 3</text>

  <rect class="box" x="492" y="250" width="190" height="80" rx="14"/>
  <text class="t" x="587" y="283" text-anchor="middle">6 One builder</text>
  <text class="s" x="587" y="308" text-anchor="middle">fixes the list, alone</text>

  <rect class="box hot" x="262" y="250" width="190" height="80" rx="14"/>
  <text class="t" x="357" y="283" text-anchor="middle">7 Score</text>
  <text class="s" x="357" y="308" text-anchor="middle">bar? plateau? cap?</text>

  <rect class="box" x="32" y="250" width="190" height="80" rx="14"/>
  <text class="t" x="127" y="283" text-anchor="middle">8 Report</text>
  <text class="s" x="127" y="308" text-anchor="middle">cycle-N.md, final.md</text>

  <path class="l" d="M825 150V250"/><path class="l" d="M722 290H682"/><path class="l" d="M492 290H452"/>
  <path class="l" d="M262 290H222"/>
  <text class="lab" x="242" y="350" text-anchor="middle">stop</text>

  <!-- loop back -->
  <path class="l" d="M357 250V206Q357 190 373 190H571Q587 190 587 174V150"/>
  <text class="lab" x="472" y="182" text-anchor="middle">not yet → next cycle</text>
</svg>
